name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"     # daily 3 AM UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate streak stats image
        uses: DenverCoder1/github-readme-streak-stats@master
        with:
          user_id: 238655679
          github_user_name: Ishika-Gaur
          theme: default
          stroke: 6D28D9
          ring: 6D28D9
          fire: 6D28D9
          curr_streak_label: 6D28D9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
